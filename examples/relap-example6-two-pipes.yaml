category: thermal_hydraulics
intro: |
  # RELAP7 Example 6: A two-pipe flow problem

  This example demonstrates flow through two pipes with different flow areas connected by a junction.
  The inlet boundary condition sets a density $\rho = 995~\text{kg}/\text{m}^3$ and a velocity $v = 1~\text{m}/\text{s}$.
  The outlet boundary condition sets a pressure $p = 95~\text{kPa}$.
  The initial velocity, pressure and temperature are $1~\text{m}/\text{s}$, $100~\text{kPa}$ and $300~\text{K}$ respectively.
  There is no heat exchange through the pipe walls.

  The first pipe goes from $x=0$ to $x=1~\text{m}$ and has a flow area $A=2~\text{m}^2$.
  The second one goes from $x=1~\text{m}$ to $x=2~\text{m}$ and has $A=1~\text{m}^2$.
  Both have 20\ elements and a Darcy friction factor $f=1$.
  As in RELAP7, when the hydraulic diameter is not given FeenoX uses the one of a circle with area\ $A$, i.e. $D_h = \sqrt{4A/\pi}$.

  In RELAP7, the topology is given by the position and orientation of each pipe plus a `Junction` component that lists which pipe ends it connects.
  In FeenoX, the two pipes are just two physical curves that share a node, which we name `junction`:

  ```{.c include="relap7-two-pipes.geo"}
  ```

  RELAP7's junction has `K = '1 1'` and `A_ref = 1.0`, i.e. a local loss coefficient equal to one for each of the two ports, both referred to an area of $1~\text{m}^2$.
  In FeenoX this is

  ```feenox
  JUNCTION POINT junction K_pipe1=1 K_pipe2=1 A_ref=1
  ```

  where `K_<pipe_group>` sets the coefficient of each port by the name of the pipe that is connected to it.
  Since here both are equal, `K=1` would also work.

  The initial condition from the manual has a uniform velocity of $1~\text{m}/\text{s}$, which does not conserve mass because the second pipe has half the area of the first.
  So the first time step has to accommodate a pressure wave.
  Instead of the second-order BDF scheme of the original RELAP example, here we use FeenoX's default backward Euler scheme, which dissipates the pressure waves, and let it choose the time step up to $t=10~\text{s}$.

  At steady state, the mass flow is $\dot{m} = \rho v A = 1990~\text{kg}/\text{s}$ in both pipes, the velocity is $1~\text{m}/\text{s}$ in the first pipe and $2~\text{m}/\text{s}$ in the second one,
  and the pressure has a step at the junction that accounts for both the local losses and the change in kinetic energy.
  The output shows the mass flow in each pipe, the inlet pressure and the pressure drop between the two nodes next to the junction.
  At the end, the axial pressure and velocity profiles are written into a file.

