category: thermal_hydraulics
intro: |
  # RELAP7 Example 2: A transient pipe flow problem

  The second example from the RELAP7 manual uses the same pipe as [example 1](#relap7-example-1-a-simple-pipe-flow-problem),
  but now

   1. the problem is a transient from $t=0$ to $t=10~\text{s}$, with a varaible time-stepping scheme starting from $\Delta t_0 = 1~\text{ms}$ using a second-order BDF method (the original RELAP example uses fixed $\Delta t$),
   2. the water starts at rest with $p=15.51~\text{MPa}$ and $T=559.15~\text{K}$ everywhere, and
   3. the Darcy friction factor is not computed from a correlation but given as a function of time that rises linearly from $f=0.01$ at $t=0$ to $f=0.02$ at $t=50~\text{ms}$ and stays constant afterwards.

  The inlet still imposes $\rho = 753.632~\text{kg}/\text{m}^3$ and $v = 4.43~\text{m}/\text{s}$, and the outlet still imposes $p=15.51~\text{MPa}$.
  We re-use the same mesh `relap7-pipe.msh` from example\ 1.

  In FeenoX, a transient problem is just a problem with a positive `end_time`.
  The initial conditions are given as functions `p_0`, `T_0` and `v_0` of the space,
  and the time-dependent friction factor is a regular point-wise defined function of time\ $t$
  that is used in the `f` property of the pipe material.

  At the end of the transient, the mass flow should be $\rho v A$ and the pressure drop should follow Darcy-Weisbach with $f=0.02$.

