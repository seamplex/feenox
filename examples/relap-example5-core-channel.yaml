category: thermal_hydraulics
intro: |
  # RELAP7 Example 5: A core channel with a fuel rod

  The fifth example from the RELAP7 manual simulates the flow of water through a vertical PWR subchannel heated by a single fuel rod.

  ![Schematic view of the core channel (figure 4 of the RELAP7 manual).](relap-example5.png)

  This example simulates fluid flow and heat transfer in a core channel.
  It simulates the fluid flow in one subchannel with a single fuel rod as the heat source.
  A prescribed power of $77.3~\text{kW}$ is supplied to the fuel rod.
  The inlet boundary condition sets a density $\rho = 753.68~\text{kg}/\text{m}^3$ and a velocity $v = 4.43~\text{m}/\text{s}$.
  The outlet boundary condition sets a pressure $p = 15.5~\text{MPa}$.
  The fuel rod is made of fuel, gap and clad, each of them with a different thermal conductivity, density and specific heat.
  The vertical channel is $3.865~\text{m}$ long, divided into 40\ elements:

  ```{.c include="relap7-core-channel.geo"}
  ```

  The RELAP7 manual says that the flow area and the hydraulic diameter of the subchannel "can easily be calculated using a script in RELAP-7"
  that has to be run from the scripts folder, giving the outer radius $r_o = 4.748~\text{mm}$ of the rod and the pitch $p = 12.6~\text{mm}$ of the lattice.
  In FeenoX there is no need for an external script, we just write the expressions in the input file:

  $$
  A = p^2 - \pi r_o^2 \qquad\qquad D_h = \frac{4A}{2\pi r_o}
  $$

  which give the very same $A=8.79375 \times 10^{-5}~\text{m}^2$ and $D_h = 0.01179~\text{m}$ as the manual.

  The fuel rod is a `HEAT_STRUCTURE` attached to the physical group `channel`, whose `FUEL`, `GAP` and `CLAD` layers are three other materials with constant conductivity\ `k`, density\ `rho_s` and specific heat\ `cp`.
  The geometry of the rod (radius and widths of each layer and number of radial cells) and its total power `hs_power` go in the channel's `MATERIAL`, alongside the flow properties.
  The mapping with RELAP7's `CoreChannel` component is:

   * `dim_hs = 2` is FeenoX's default `AXIAL_CONDUCTION` (i.e. radial and axial conduction in the rod),
   * `power_fraction = '1.0 0.0 0.0'` is FeenoX's only option: the power is uniformly generated in the fuel (because the expression is a constant, we can have expressions of $x$, $y$, $z$ and/or $t$),
   * `Hw = 5.33e4` is the heat transfer coefficient `h_wall` between the clad and the coolant,
   * `initial_Ts = 559.15` is the initial solid temperature `T_solid_0(r,x,y,z)`, which is a function of the radius and the space, and
   * the heated perimeter is the outer clad circumference in both codes.

  As the RELAP7 input does not touch the gravity and the channel goes upwards along $z$, we keep FeenoX's default $g_z = -9.81~\text{m}/\text{s}^2$, which is also RELAP7's default.
  As in the previous examples, the water starts at rest and we use a variable time step starting from $\Delta t_0 = 1~\text{ms}$ with a second-order BDF method (the original RELAP example uses a fixed $\Delta t = 100~\text{ms}$) up to $t=50~\text{s}$.

  The output shows the mass flow, the coolant temperature at the outlet, the fuel centerline and clad surface temperatures at the outlet height, and the heat transferred from the rod to the coolant, which approaches the generated $77.34~\text{kW}$ as the rod reaches steady state.
  At the end, the axial profiles of the coolant, clad surface, fuel surface and fuel centerline temperatures are written into a file.

