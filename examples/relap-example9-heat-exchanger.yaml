intro: |
  # RELAP7 Example 9: A heat exchanger

  The ninth example from the RELAP7 manual is a counter-flow heat exchanger.
  The heat exchanger consists of hot water flowing in a primary pipe and cold water flowing in a secondary pipe in the opposite direction, separated by a solid wall.
  The inlets have a prescribed stagnation pressure of $105~\text{kPa}$ and stagnation temperatures of $400~\text{K}$ for the primary side and $300~\text{K}$ for the secondary side.
  The outlets have a prescribed static pressure of $100~\text{kPa}$.
  The water is initially at $p=100~\text{kPa}$, $T=300~\text{K}$ and $v = 1~\text{m}/\text{s}$, and the wall at $300~\text{K}$.

  Both pipes are $1~\text{m}$ long with 10\ elements, a flow area of $7.85398163 \times 10^{-5}~\text{m}^2$, a hydraulic diameter of $1~\text{cm}$ and a Darcy friction factor $f=0.01$:

  ```{.c include="relap7-heat-exchanger.geo"}
  ```

  The wall is a $1~\text{cm}$-thick plate, $1~\text{m}$ deep, with two cells across its thickness, and with $k = 100~\text{W}/(\text{m}\cdot\text{K})$, $\rho = 100~\text{kg}/\text{m}^3$ and $c_p = 100~\text{J}/(\text{kg}\cdot\text{K})$.
  It exchanges heat with both pipes through a heat transfer coefficient of $10^4~\text{W}/(\text{m}^2\cdot\text{K})$.
  In RELAP7 this takes three components: a `HeatStructure` plus one `HeatTransferFromHeatStructure` for each side.
  In FeenoX, it is a single named `HEAT_STRUCTURE` with a `PRIMARY` and a `SECONDARY` pipe:

  ```feenox
  HEAT_STRUCTURE NAME exchanger {
    TYPE PLATE MATERIAL wall THICKNESS 0.01 CELLS 2 DEPTH 1
    PRIMARY primary SECONDARY secondary H_PRIMARY 1e4 H_SECONDARY 1e4
    AXIS 1 0 0
  }
  ```

  where `AXIS` is the direction along which the two pipes are matched, station by station.
  The wall includes both transverse and axial conduction, as RELAP7's `dim = 2` heat structure does.

  > **Heads up!** The manual says "this example problem is for subcooled water only", but at $1~\text{bar}$ water boils at about $373~\text{K}$, so water entering at $400~\text{K}$ is not subcooled.
  > RELAP7 uses a liquid-only equation of state, which silently extrapolates into the metastable region.
  > FeenoX only handles single-phase liquid water (for now) and warns when this happens.
  > So we raise the pressure level to $1~\text{MPa}$, where the saturation temperature is about $453~\text{K}$, but keep the $5~\text{kPa}$ difference between the inlets and the outlets that drives the flow.
  > The pressure level is the variable `p_out` in the input file, so the original problem can be solved by setting `p_out = 1e5`.

  As in the previous examples, we use FeenoX's default backward Euler scheme and let it choose the time step up to $t=10~\text{s}$.
  The output shows the outlet temperatures, the mass flows and the heat going into each fluid (negative for the primary, which is cooled down, and positive for the secondary, which is heated up).
  At the end, the axial profiles of the primary fluid, the primary side of the wall, the middle of the wall, the secondary side of the wall and the secondary fluid temperatures are written into a file.

