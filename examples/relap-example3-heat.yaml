category: thermal_hydraulics
intro: |
  # RELAP7 Example 3: Adding heat to a simple pipe flow problem

  The third example from the RELAP7 manual is the same transient as [example 2](#relap7-example-2-a-transient-pipe-flow-problem)
  but now the pipe wall is kept at a fixed temperature $T_\text{wall} = 565~\text{K}$, which is higher than the incoming water at $559.15~\text{K}$.
  As in example\ 2, we use a variable time step starting from $\Delta t_0 = 1~\text{ms}$ with a second-order BDF method (the original RELAP example uses a fixed $\Delta t = 10~\text{ms}$).

  In FeenoX, the main change with respect to example\ 2 is adding `T_wall=565` to the pipe `MATERIAL`.
  This adds a heat flux $h_\text{wall} P_h (T_\text{wall}-T)$ per unit length to the energy equation, where

   * $P_h$ is the heated perimeter, and
   * the heat transfer coefficient $h_\text{wall}$ follows the TRACE single-phase tube model, namely the maximum of laminar ($\text{Nu}=4.36$), corrected Gnielinski and natural convection, with the water conductivity from IAPWS-2011.

  Both can be given with the `P_h` and `h_wall` material properties.
  FeenoX's default heated perimeter is $4A/D_h$, but RELAP-7 assumes the circumference $2\sqrt{\pi A}$ of a circle with area\ $A$.
  Since here $A$ and $D_h$ are not consistent with a circular pipe, these two differ by about 11%, so we set `P_h=2*sqrt(pi*A)` explicitly to match the original RELAP-7 input.

  RELAP-7's input also sets `gravity = '0 0 0'`.
  The pipe is horizontal so gravity does not enter the momentum equation, but it does enter the natural-convection part of the heat transfer coefficient.
  FeenoX's default is $g_z = -9.81~\text{m}/\text{s}^2$, so we set `g_z = 0` to stay faithful to the original problem (it does not make any difference in this case, though).

  The output shows the mass flow, the temperature at the inlet and outlet nodes and the power $\dot{m}(h_\text{out}-h_\text{in})$ absorbed between those two nodes.
  Note that the inlet node is a control volume that already receives half the wall heat of the first element, so its temperature is higher than the $559.15~\text{K}$ of the incoming stream.
  After the startup transient, the outlet temperature slightly overshoots and then settles at $T_\text{out} \approx 563.27~\text{K}$.

