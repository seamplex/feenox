category: thermal_hydraulics
intro: |
  # RELAP7 Example 10: A loop with a core channel and a heat exchanger

  The tenth example from the RELAP7 manual is a loop with a core channel that heats the water and a heat exchanger that cools it down.

  ![Original diagram of the loop from the RELAP7 manual.](relap-example10.png)

  This example is a simple loop that consists of six pipes, a core channel and a heat exchanger.
  Each component has a different length, but all of them have the same flow area.
  The core channel heats up the water, while the heat exchanger cools it down.
  Pipe\ 5 connects the loop to a pressurizer with a pressure of $200~\text{kPa}$ that sets the system pressure.
  The water is initially at $p = 200~\text{kPa}$, $T = 300.15~\text{K}$ and $v = 1~\text{m}/\text{s}$.
  The secondary side of the heat exchanger has an inlet mass flow of $223.77~\text{kg}/\text{s}$ at $300.15~\text{K}$ and an outlet pressure of $200~\text{kPa}$.

  The loop lives in the $y$-$z$ plane and we use the same coordinates as the RELAP7 input:

  ```{.c include="relap7-natural-loop.geo"}
  ```
  
  ![Gmsh topology](relap7-natural-loop-geo.svg)

  The input file has a few details that are worth discussing.

   1. In the input file the secondary side of the heat exchanger starts at the top ($z=5.98~\text{m}$) and flows downwards, i.e. in the same direction as the primary side (co-current).
      But pipe\ 6, which feeds it, ends at the bottom ($z=2.27~\text{m}$).
      RELAP7's `Junction7` connects these two ends anyway, $3.7~\text{m}$ apart, because junctions connect pipes by topology regardless of their coordinates.
      In FeenoX we do the same with `MERGE`:

      ```feenox
      JUNCTION POINT junction7 MERGE K=0 A_ref=A_flow
      ```

      The figure, however, shows a counter-flow heat exchanger with the secondary flowing upwards.
      We follow the input file.

   2. The core channel has a flow area of $0.44934~\text{m}^2$ and a heated perimeter of $497.78~\text{m}$, so it represents a bundle of many fuel rods.
      In FeenoX this is a `HEAT_STRUCTURE` with a single equivalent rod (fuel and clad, no gap) and a `rod_count` equal to the heated perimeter divided by the outer clad circumference $2\pi \cdot 4~\text{mm}$.
      The total power $51.296~\text{MW}$ is uniformly generated in the fuel.

   3. The heat exchanger wall is a $4.4~\text{mm}$-thick plate with `depth = 1` in the input file.
      But RELAP7 scales the wall heat flux by the heated perimeter $P_\text{hf} = 327.57~\text{m}$ on each fluid side, so the wall behaves as a plate with a depth equal to $P_\text{hf}$.
      That is the `DEPTH` we give to the two-sided `HEAT_STRUCTURE`.

   4. The pressurizer at the end of pipe\ 5 is a "reversible" outlet in RELAP7, meaning that water can also flow back into the loop.
      In FeenoX, a boundary condition with both `p` and `T` sets the pressure and the temperature of the water that enters if the flow reverses.

  The input does not change the gravity, so we keep FeenoX's default $g_z = -9.81~\text{m}/\text{s}^2$, which is also RELAP7's default.
  As in the previous examples, we use FeenoX's default backward Euler scheme and let it choose the time step up to $t=50~\text{s}$, the same end time as in the RELAP7 example.

  The output shows the primary mass flow through the core, the core outlet temperature, the primary and secondary outlet temperatures of the heat exchanger, the power going from the core into the water and the power going from the wall into the secondary side.
  The water starts with $v=1~\text{m}/\text{s}$ but the loop friction slows it down until the core heats the water up and buoyancy drives a natural circulation of about $195~\text{kg}/\text{s}$.
  It takes the water about half a minute to go around the loop and the heat exchanger wall has a large heat capacity, so at $t=50~\text{s}$ the system is still far from steady state: the secondary side removes less than half the power of the core.
  The core outlet temperature stays below the saturation temperature at $200~\text{kPa}$ (about $393~\text{K}$), so the water remains subcooled.
  At the end, the axial temperature profiles along the heat exchanger are written into a file.
  The wall is still colder than both fluids in its lower half, i.e. it is still absorbing heat from both sides.

